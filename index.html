<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w11-32 的个人主页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-bottom: 10px; color: #1d1d1f; }
        p { color: #555; line-height: 1.6; }
        .links { margin-top: 25px; }
        .links a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 20px;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .links a:hover { background-color: #0077ed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, World! 👋</h1>
        <p>欢迎来到 <b>w11-32</b> 的免费个人网站。</p>
        <p>这个网站使用纯 HTML 和 GitHub Pages 免费搭建。</p>
        <div class="links">
            <a href="https://github.com/w11-32" target="_blank">我的 GitHub</a>
            <a href="#">联系方式</a>
        </div>
    </div>
</body>
</html>
